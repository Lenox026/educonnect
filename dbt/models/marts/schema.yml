version: 2

models:
  - name: attendance_weekly_by_class
    description: One row per class per Monday-start week, with the share of marks that were present or late.
    columns:
      - name: week_start
        data_tests: [not_null]
      - name: class_id
        data_tests: [not_null]
      - name: attendance_rate
        data_tests: [not_null]
  - name: grade_averages_by_class
    description: Average grade percentage for each class.
    columns:
      - name: class_id
        data_tests: [unique, not_null]
      - name: average_percent
        data_tests: [not_null]
  - name: grade_bands_by_class
    description: Grade counts in the bands 0-49, 50-59, 60-69, 70-79, and 80-100.
    columns:
      - name: band
        data_tests:
          - not_null
          - accepted_values:
              values: ["0-49", "50-59", "60-69", "70-79", "80-100"]

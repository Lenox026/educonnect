# Local PostgreSQL, Redis, and Redpanda for EduConnect.
# The database password is for this laptop demo only.
# Redis has no password. docker compose down clears today's attendance cache.
# Redpanda is the stream. The API publishes to it on localhost:19092.
# Debezium (Kafka Connect, port 8083) copies PostgreSQL changes onto Redpanda.
# It needs wal_level=logical, which the postgres service sets below.
# The sftp service is a fake school-office server on localhost:2222. Its upload
# folder is data/sftp on this machine. User and password are for this demo only.
# Start: docker compose up -d
# Stop:  docker compose down
# Wipe the database: docker compose down -v

services:
  postgres:
    image: postgres:16
    container_name: educonnect-postgres
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: educonnect
      POSTGRES_PASSWORD: educonnect
      POSTGRES_DB: educonnect
    ports:
      - "5432:5432"
    volumes:
      - educonnect_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U educonnect -d educonnect"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: educonnect-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redpanda:
    image: redpandadata/redpanda:v24.3.6
    container_name: educonnect-redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=warn
    ports:
      - "19092:19092"
    volumes:
      - educonnect_redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  connect:
    image: quay.io/debezium/connect:2.7
    container_name: educonnect-connect
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: redpanda:9092
      GROUP_ID: educonnect-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
    ports:
      - "8083:8083"

  sftp:
    image: atmoz/sftp
    container_name: educonnect-sftp
    command: educonnect:educonnect:::upload
    ports:
      - "2222:22"
    volumes:
      - ./data/sftp:/home/educonnect/upload

volumes:
  educonnect_pg:
  educonnect_redpanda:

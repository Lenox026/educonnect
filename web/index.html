<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EduConnect attendance</title>
  <style>
    :root {
      --navy: #0b2341;
      --navy-soft: #14345c;
      --green: #22c55e;
      --green-dark: #16a34a;
      --page: #f4f7fb;
      --card: #ffffff;
      --text: #10243f;
      --muted: #5d6d82;
      --line: #e3ebf4;
      --mint: #e8f8ee;
      --late: #f59e0b;
      --absent: #ef4444;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--text);
      background: var(--page);
    }

    aside {
      width: 260px;
      flex: none;
      padding: 1.6rem 1.3rem;
      background: var(--navy);
      color: white;
      display: flex;
      flex-direction: column;
    }

    .brand {
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }

    .mark {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: white;
      display: grid;
      place-items: center;
      flex: none;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.25rem;
      letter-spacing: -0.02em;
    }

    .brand p {
      margin: 0.1rem 0 0;
      color: #b7c6d8;
      font-size: 0.72rem;
    }

    nav {
      margin-top: 2rem;
      display: grid;
      gap: 0.35rem;
    }

    nav span {
      padding: 0.7rem 0.85rem;
      border-radius: 10px;
      color: #d5e2ef;
    }

    nav .here {
      background: var(--green);
      color: white;
      font-weight: 650;
    }

    .aside-note {
      margin-top: auto;
      padding-top: 2rem;
      color: #d7e4c8;
      font-family: Georgia, serif;
      font-size: 1.15rem;
      line-height: 1.25;
    }

    .aside-note em {
      display: block;
      width: 4.2rem;
      height: 3px;
      margin-top: 0.45rem;
      border-radius: 99px;
      background: var(--green);
    }

    main {
      flex: 1;
      padding: 2rem;
    }

    main h2 {
      margin: 0;
      font-size: 1.7rem;
    }

    .lead {
      margin: 0.35rem 0 1.2rem;
      color: var(--muted);
    }

    .card {
      max-width: 32rem;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(11, 35, 65, 0.06);
      padding: 1.25rem;
    }

    label {
      display: block;
      margin-top: 0.9rem;
      font-size: 0.92rem;
      font-weight: 650;
    }

    input {
      width: 100%;
      margin-top: 0.35rem;
      padding: 0.7rem 0.75rem;
      border: 1px solid #d5e0ec;
      border-radius: 10px;
      font: inherit;
      color: var(--text);
      background: #fbfcfe;
    }

    input:focus {
      outline: 2px solid rgba(34, 197, 94, 0.35);
      border-color: var(--green);
    }

    button {
      margin-top: 1.1rem;
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 0.8rem 1rem;
      background: var(--green);
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: var(--green-dark); }

    #message {
      max-width: 32rem;
      margin-top: 1rem;
      white-space: pre-wrap;
    }

    #message:empty { display: none; }

    .marks { display: grid; gap: 0.6rem; }

    .mark-row {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: center;
      padding: 0.8rem 0.9rem;
      border-radius: 12px;
      background: var(--mint);
    }

    .status {
      border-radius: 99px;
      padding: 0.2rem 0.65rem;
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: capitalize;
      background: white;
    }

    .status.present { color: var(--green-dark); }
    .status.late { color: #b45309; }
    .status.absent { color: var(--absent); }

    @media (max-width: 760px) {
      body { display: block; }
      aside { width: auto; }
      .aside-note { margin-top: 2rem; }
      main { padding: 1.2rem; }
    }
  </style>
</head>
<body>
  <aside>
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <path d="M4 8.5c3-2 6.2-2 10 0 3.8-2 7-2 10 0v12c-3-2-6.2-2-10 0-3.8-2-7-2-10 0v-12z" stroke="#0b2341" stroke-width="1.7"/>
          <path d="M14 8.5v12" stroke="#22c55e" stroke-width="1.7"/>
        </svg>
      </div>
      <div>
        <h1>EduConnect</h1>
        <p>Connecting schools. Empowering education.</p>
      </div>
    </div>
    <nav>
      <span class="here">Attendance</span>
    </nav>
    <p class="aside-note">Better education, a brighter future.<em></em></p>
  </aside>
  <main>
    <h2>Today's attendance</h2>
    <p class="lead">Sign in to read one learner's marks. Names in this project are fake.</p>
    <form id="login" class="card">
      <label>Email <input id="email" type="email" autocomplete="username" required></label>
      <label>Password <input id="password" type="password" autocomplete="current-password" required></label>
      <label>Learner id <input id="student" type="number" value="1001" min="1" required></label>
      <button type="submit">Show today's marks</button>
    </form>
    <div id="message" class="card"></div>
  </main>
  <script>
    // Fill these four values from the stack outputs after sam deploy.
    const settings = {
      region: "eu-north-1",
      userPoolId: "USER_POOL_ID",
      clientId: "CLIENT_ID",
      apiUrl: "API_URL"
    };

    document.getElementById("login").addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = document.getElementById("message");
      message.textContent = "Signing in...";
      try {
        const token = await signIn(
          document.getElementById("email").value,
          document.getElementById("password").value
        );
        const studentId = document.getElementById("student").value;
        const response = await fetch(
          settings.apiUrl.replace(/\/$/, "") + "/attendance/today?student_id=" + studentId,
          { headers: { Authorization: "Bearer " + token } }
        );
        const body = await response.json();
        if (!response.ok) {
          message.textContent = body.detail || body.message || "The API refused the request.";
          return;
        }
        if (!body.marks.length) {
          message.textContent = "No marks for learner " + studentId + " on " + body.attendance_date + ".";
          return;
        }
        showMarks(body.marks);
      } catch (error) {
        message.textContent = error.message;
      }
    });

    function showMarks(marks) {
      const message = document.getElementById("message");
      message.replaceChildren();
      const list = document.createElement("div");
      list.className = "marks";
      for (const mark of marks) {
        const row = document.createElement("div");
        row.className = "mark-row";
        const who = document.createElement("span");
        who.textContent = "Learner " + mark.student_id + " · class " + mark.class_id;
        const status = document.createElement("span");
        status.className = "status " + mark.status;
        status.textContent = mark.status;
        row.append(who, status);
        list.append(row);
      }
      message.append(list);
    }

    async function signIn(email, password) {
      const response = await fetch("https://cognito-idp." + settings.region + ".amazonaws.com/", {
        method: "POST",
        headers: {
          "Content-Type": "application/x-amz-json-1.1",
          "X-Amz-Target": "AWSCognitoIdentityProviderService.InitiateAuth"
        },
        body: JSON.stringify({
          AuthFlow: "USER_PASSWORD_AUTH",
          ClientId: settings.clientId,
          AuthParameters: { USERNAME: email, PASSWORD: password }
        })
      });
      const body = await response.json();
      if (!response.ok || !body.AuthenticationResult) {
        throw new Error(body.message || "Sign-in failed.");
      }
      return body.AuthenticationResult.IdToken;
    }
  </script>
</body>
</html>

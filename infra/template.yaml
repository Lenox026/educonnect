AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: EduConnect attendance and announcements API, Cognito login with roles, CloudFront page, and a Lambda error alarm.

Parameters:
  AlertEmail:
    Type: String
    Description: Email that receives an absence alert. Confirm the SNS email after deploy. Do not use SMS.
    AllowedPattern: ".+@.+"
    ConstraintDescription: Use an email address. This stack does not send SMS.

Resources:
  AttendanceTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: educonnect-attendance
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: attendance_date
          AttributeType: S
        - AttributeName: student_class
          AttributeType: S
      KeySchema:
        - AttributeName: attendance_date
          KeyType: HASH
        - AttributeName: student_class
          KeyType: RANGE

  AbsenceTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: educonnect-absence
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  DataLakeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub educonnect-data-lake-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  AttendanceLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/educonnect-attendance
      RetentionInDays: 14

  AttendanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: educonnect-attendance
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:Query
                Resource: !GetAtt AttendanceTable.Arn
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref AbsenceTopic
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub ${AttendanceLogGroup.Arn}:*

  AttendanceFunction:
    Type: AWS::Serverless::Function
    DependsOn: AttendanceLogGroup
    Properties:
      FunctionName: educonnect-attendance
      CodeUri: ../src/aws/
      Handler: attendance_handler.handler
      Runtime: python3.12
      Timeout: 10
      MemorySize: 128
      Role: !GetAtt AttendanceRole.Arn
      Description: Save one attendance mark and email the topic when a learner is absent.
      Environment:
        Variables:
          TABLE_NAME: !Ref AttendanceTable
          TOPIC_ARN: !Ref AbsenceTopic
      Events:
        PostAttendance:
          Type: HttpApi
          Properties:
            ApiId: !Ref AttendanceApi
            Path: /attendance
            Method: POST
        GetToday:
          Type: HttpApi
          Properties:
            ApiId: !Ref AttendanceApi
            Path: /attendance/today
            Method: GET

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: educonnect-users
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 8

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: educonnect-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admin
      UserPoolId: !Ref UserPool

  TeacherGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: teacher
      UserPoolId: !Ref UserPool

  ParentGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: parent
      UserPoolId: !Ref UserPool

  AnnouncementsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: educonnect-announcements
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: school_id
          AttributeType: S
        - AttributeName: sort_key
          AttributeType: S
      KeySchema:
        - AttributeName: school_id
          KeyType: HASH
        - AttributeName: sort_key
          KeyType: RANGE

  AnnouncementsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/educonnect-announcements
      RetentionInDays: 14

  AnnouncementsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: educonnect-announcements
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:Query
                Resource: !GetAtt AnnouncementsTable.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub ${AnnouncementsLogGroup.Arn}:*

  AnnouncementsFunction:
    Type: AWS::Serverless::Function
    DependsOn: AnnouncementsLogGroup
    Properties:
      FunctionName: educonnect-announcements
      CodeUri: ../src/aws/
      Handler: announcements_handler.handler
      Runtime: python3.12
      Timeout: 10
      MemorySize: 128
      Role: !GetAtt AnnouncementsRole.Arn
      Description: Teachers post whole-school announcements and every role reads them.
      Environment:
        Variables:
          TABLE_NAME: !Ref AnnouncementsTable
      Events:
        PostAnnouncement:
          Type: HttpApi
          Properties:
            ApiId: !Ref AttendanceApi
            Path: /announcements
            Method: POST
        ListAnnouncements:
          Type: HttpApi
          Properties:
            ApiId: !Ref AttendanceApi
            Path: /announcements
            Method: GET

  AttendanceApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: "$default"
      Auth:
        DefaultAuthorizer: CognitoAuth
        Authorizers:
          CognitoAuth:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience:
                - !Ref UserPoolClient
      CorsConfiguration:
        AllowOrigins:
          - !Sub https://${WebDistribution.DomainName}
        AllowMethods:
          - GET
          - POST
        AllowHeaders:
          - content-type
          - authorization

  ErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: educonnect-attendance-errors
      AlarmDescription: Email the absence topic when the attendance Lambda reports an error.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref AttendanceFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AbsenceTopic

  AnnouncementsErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: educonnect-announcements-errors
      AlarmDescription: Email the absence topic when the announcements Lambda reports an error.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref AnnouncementsFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AbsenceTopic

  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub educonnect-web-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  WebOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub educonnect-web-${AWS::AccountId}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: EduConnect attendance page
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${WebBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}

Outputs:
  ApiUrl:
    Description: Base URL. POST /attendance, GET /attendance/today, POST and GET /announcements.
    Value: !GetAtt AttendanceApi.ApiEndpoint
  AttendanceTableName:
    Description: DynamoDB table for one day's marks.
    Value: !Ref AttendanceTable
  AnnouncementsTableName:
    Description: DynamoDB table for whole-school announcements.
    Value: !Ref AnnouncementsTable
  AbsenceTopicArn:
    Description: SNS topic that emails an absence alert.
    Value: !Ref AbsenceTopic
  DataLakeBucketName:
    Description: Private bucket for raw-events/YYYY/MM/DD/.
    Value: !Ref DataLakeBucket
  WebBucketName:
    Description: Private bucket for the one-page site. CloudFront reads it.
    Value: !Ref WebBucket
  SiteUrl:
    Description: CloudFront address of the attendance page.
    Value: !Sub https://${WebDistribution.DomainName}
  UserPoolId:
    Description: Cognito user pool. Create the demo user in this pool.
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito app client used by the web page.
    Value: !Ref UserPoolClient